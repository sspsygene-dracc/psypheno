    date: "2026-09-01"
    comment: >
      Initial draft — CRISPRi + CaMPARI2 primary screen hit genes across 7 conditions.
      Note: only the 389 hit genes (FDR < 10% in primary glutamate screen) are available
      from the published supplementary data. The full 1,343-gene primary screen has not
