# Which site instances this dataset may be served on (#225). Mandatory;
# `dev` is always required — dev is the build superset that prod and int are
# subsetted from at promotion time.
deployTo:
  - dev
  - int
  - prod
tables:
  - table: clinvar_gene_summary
    shortLabel: clinvar_gene_summary
    mediumLabel: "Landrum 2018 - ClinVar Curated Per-Gene Variant Counts"
    longLabel: "Per-gene ClinVar variant submission and pathogenicity counts"
    description: >
      Per-gene aggregate counts from NCBI ClinVar's gene_specific_summary
      table — total variant submissions, total unique alleles, count of
      submissions explicitly reporting this gene, count of alleles classified
      Pathogenic/Likely-pathogenic, count of submissions with uncertain
      classifications, and count of submissions with conflicting
      interpretations. Refreshed weekly by NCBI; preprocess.py downloads the
      latest snapshot at build time.
    source: "ClinVar FTP — gene_specific_summary.txt (updated weekly by NCBI)"
    in_path: clinvar_gene_summary.tsv
    separator: "\t"
    organism: "Homo sapiens"
    organism_key: human
    assay: curated
    condition: []
    categories:
      - curated database
      - clinical variants
      - pathogenicity
    links:
      - url: https://www.ncbi.nlm.nih.gov/clinvar/
        label: ClinVar (NCBI)
      - url: https://ftp.ncbi.nlm.nih.gov/pub/clinvar/tab_delimited/gene_specific_summary.txt
        label: Source TSV (gene_specific_summary.txt)
        description: Refreshed weekly; preprocess.py downloads this at build time.
    fieldLabels:
      symbol: "HGNC gene symbol (resolved at preprocess time; raw ClinVar label preserved in symbol_raw — many ClinVar entries are non-HGNC labels like chromosome regions, fusion alleles, antisense RNA names, which are kept verbatim)"
      total_submissions: "Count of all ClinVar variant submissions associated with this gene, including multiple submissions of the same allele by different submitters. Per-gene aggregate from the gene_specific_summary.txt snapshot."
      total_alleles: "Count of unique alleles reported for this gene across all ClinVar submissions."
      submissions_reporting_this_gene: "Count of submissions that explicitly identify this gene as the affected locus (subset of total_submissions, excluding submissions that name a different overlapping gene)."
      alleles_reported_pathogenic_likely_pathogenic: "Count of unique alleles classified as Pathogenic or Likely Pathogenic by at least one submitter (subset of total_alleles)."
      number_uncertain: "Count of submissions with a Variant of Uncertain Significance (VUS) classification."
      number_with_conflicts: "Count of submissions where independent submitters reported conflicting clinical interpretations for the same allele."
    gene_mappings:
      - column_name: Symbol
        link_table_name: gene
        species: human
        perturbed_or_target: perturbed
    changelog:
      - date: "2026-05-07"
        message: "Initial data load from ClinVar gene_specific_summary.txt."
