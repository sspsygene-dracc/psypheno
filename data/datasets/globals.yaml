fieldLabels:
  p_value: "P-value"
  pvalue: "Nominal p-value"
  padj: "BH-adjusted p-value"
  fdr: "False discovery rate (adjusted p-value)"
  qval: "Q-value (FDR-adjusted p-value)"
  logfc: "Log fold change"
  lfc: "Log fold change"
  log2foldchange: "Log2 fold change"
  log2_fold_change: "Log2 fold change"
  basemean: "Mean of normalized counts (DESeq2)"
  lfcse: "Log fold change standard error"
  stat: "Wald test statistic (DESeq2)"
  cell_type: "Brain cell type"

# Per-token acronym map for column *headers* (psypheno #210). Distinct from
# fieldLabels above (which are the long "?" tooltip sentences): these are short
# per-token replacements applied when rendering a column's header. At load time
# each column name is split on "_" and every token is replaced by its entry here
# (case-insensitive); tokens with no entry fall back to plain title-casing. So
# `asd_fdr` -> "ASD FDR", `tdt_statistic` -> "TDT Statistic". A per-table
# `columnLabels:` entry (in a dataset's config.yaml) overrides the whole header
# for context-specific cases this token map can't produce.
#
# Curated to unambiguous tokens only. Deliberately EXCLUDED because they collide
# with real English / gene names / vary by dataset: stat, or, de, on, off, high,
# age, exp, sd, df, wt, hc. Spell those out per-dataset via `columnLabels:`.
columnHeaderTokens:
  # Tier 1 — plain initialisms (uppercase)
  asd: ASD
  fdr: FDR
  ptv: PTV
  ndd: NDD
  ci: CI
  scz: SCZ
  bd: BD
  hpo: HPO
  mgi: MGI
  ddid: DDID
  pmid: PMID
  ntc: NTC
  sfari: SFARI
  # Tier 2 — special mixed-case (title-case and all-caps both wrong)
  logfc: logFC
  log2fc: log2FC
  lfc: logFC
  pval: p-value
  pvalue: p-value
  padj: p-adj.
  qval: q-value
  zscore: z-score
  lof: LoF
  gnomad: gnomAD
  refseq: RefSeq
  dup15q: dup15q
  # Not in current columns but certain to appear — seeded now
  snv: SNV
  cnv: CNV
  deg: DEG
  eqtl: eQTL
  gwas: GWAS
  tf: TF
  grn: GRN
  ipsc: iPSC
  npc: NPC
  esc: ESC
  hgnc: HGNC
  ensg: ENSG
  zfin: ZFIN
  tpm: TPM
  cpm: CPM
  auc: AUC
  usv: USV
  mpc: MPC

assayTypes:
  expression: "Gene Expression (RNA-seq)"
  spatial: "Spatial Transcriptomics"
  behavior: "Behavioral Assays"
  perturbation: "Perturbation Screen"
  perturbation_deg: "Perturbation Differential Expression (DEG)"
  curated: "Curated Database"
  phenotype: "Phenotype Annotation"

# Assay types whose per-study p-values are comparable enough to combine in the
# cross-study meta-analysis (/most-significant). Restricting the combination to
# differential-expression assays keeps the combined ranking interpretable and
# stable as non-DEG datasets (GRN edges, cell-proportion shifts, curated lists)
# are added. See psypheno issue #187. The `perturbation_deg` assay is the subset
# of perturbation screens that report genuine per-gene differential expression
# (Perturb-seq / ECCITE-seq / bulk-RNA DEGs), as opposed to GRN inference or
# cell-type abundance shifts, which stay tagged `perturbation`.
metaAnalysisAssays:
  - expression
  - perturbation_deg

conditionTypes:
  autism: "Autism"
  scz: "Schizophrenia"
  bipolar: "Bipolar Disorder"
  ndc: "Neurodevelopmental Conditions"

organismTypes:
  human: "Human"
  mouse: "Mouse"
  zebrafish: "Zebrafish"

# Modality taxonomy for the collated cross-modality overview table (psypheno
# epic #220; this block is leaf #211). The overview matrix is perturbed-gene ×
# modality; these are its user-facing *columns*, in display order. See
# docs/consortium-overview.md for the consortium background and the table's
# intent.
#
# The modality axis is a SUPERSET of `assayTypes` above: each modality maps to
# one or more assay-type keys (`assayTypes:` list), renamed to a user-facing
# `label`. `alwaysShow: true` marks the expensive, low-output modalities that
# must render as a column even when they have zero data (a not-yet-run assay is
# itself informative). Morphology and electrophysiology have no assay type and
# no data yet — they are empty always-show placeholders.
#
# Deviations from the whiteboard's 7 columns (confirmed with Johannes):
#   - No standalone FISH column. The matrix is perturbation-centric (rows =
#     perturbed genes); pure FISH is `spatial` with only target-direction links
#     and yields no rows, so only perturb-FISH survives. FISH returns if
#     non-perturbation spatial data ever lands.
#   - `curated` / `phenotype` are excluded — those datasets (ClinVar, SFARI,
#     GeneTrek, Satterstrom, MGI phenotypes) are external annotation databases,
#     not SSPsyGene consortium experiments.
#   - Generic `perturbation` (GRN edges, cell-proportion shifts, splicing —
#     non-DEG, non-spatial) folds into Perturb-seq, so every perturbation table
#     shows somewhere. Net: `spatial` -> perturb-FISH, every other perturbation
#     assay -> perturb-seq.
modalities:
  - key: expression
    label: "RNA expression"
    assayTypes:
      - expression
  - key: behavior
    label: "Behavioral"
    assayTypes:
      - behavior
    alwaysShow: true
  - key: morphology
    label: "Morphology"
    assayTypes: []
    alwaysShow: true
  - key: electrophysiology
    label: "Electrophysiology"
    assayTypes: []
    alwaysShow: true
  - key: perturb_seq
    label: "Perturb-seq"
    assayTypes:
      - perturbation_deg
      - perturbation
  - key: perturb_fish
    label: "Perturb-FISH"
    assayTypes:
      - spatial
